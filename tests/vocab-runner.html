<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>A2 Vocab &amp; Reading Automated Test Runner</title>
  <style>
    body { font-family: monospace; padding: 20px; background: #0f172a; color: #f8fafc; }
    .pass { color: #4ade80; }
    .fail { color: #f87171; font-weight: bold; }
    .summary { font-size: 1.2rem; margin-top: 20px; padding: 10px; border-top: 1px solid #334155; }
  </style>
  <script src="../vocab-data.js"></script>
</head>
<body>
  <h1>A2 Context Vocabulary Test Suite</h1>
  <div id="test-output">Running tests...</div>

  <script>
    (function () {
      const output = document.getElementById('test-output');
      const logs = [];
      let passed = 0;
      let failed = 0;

      function assert(condition, message) {
        if (condition) {
          passed++;
          logs.push('<div class="pass">✔ PASS: ' + message + '</div>');
        } else {
          failed++;
          logs.push('<div class="fail">✖ FAIL: ' + message + '</div>');
        }
      }

      const data = window.A2_VOCAB_DATA;

      // 1. Root structure
      assert(data && Array.isArray(data.units), 'A2_VOCAB_DATA exists with units array');
      assert(data.units.length === 6, 'Contains exactly 6 units (Units 1 to 6)');

      let totalVocab = 0;

      // 2. Unit Integrity
      data.units.forEach((unit, uIdx) => {
        const uNum = unit.unitNumber;
        assert(uNum === uIdx + 1, `Unit at index ${uIdx} has unitNumber ${uIdx + 1}`);
        assert(Boolean(unit.id && unit.title && unit.vietnameseTitle && unit.topic), `Unit ${uNum} has valid metadata (id, title, viTitle, topic)`);
        assert(Array.isArray(unit.paragraphs) && unit.paragraphs.length >= 3, `Unit ${uNum} has at least 3 paragraphs for TTS`);
        assert(Array.isArray(unit.vocabulary) && unit.vocabulary.length === 8, `Unit ${uNum} has exactly 8 target vocabulary items`);

        totalVocab += unit.vocabulary.length;

        // Check each vocabulary item
        unit.vocabulary.forEach(v => {
          assert(Boolean(v.id && v.word && v.ipa && v.pos && v.vietnamese && v.definition), `Vocab "${v.word}" in Unit ${uNum} has core fields`);
          assert(v.contextQuote && v.contextClue, `Vocab "${v.word}" in Unit ${uNum} has context quote and clue`);
          assert(Array.isArray(v.collocations) && v.collocations.length >= 2, `Vocab "${v.word}" in Unit ${uNum} has at least 2 collocations`);
          assert(unit.passageHtml.includes(`data-word-id="${v.id}"`), `Vocab "${v.word}" (${v.id}) is tagged in Unit ${uNum} passageHtml`);
        });

        // Check context questions
        assert(Array.isArray(unit.contextQuestions) && unit.contextQuestions.length >= 4, `Unit ${uNum} has at least 4 context inference questions`);
        unit.contextQuestions.forEach((cq, cqIdx) => {
          assert(cq.options && cq.options.length === 4 && cq.answer >= 0 && cq.answer <= 3, `Unit ${uNum} context question ${cqIdx + 1} has 4 options and valid answer index`);
          assert(cq.explanation && cq.explanation.length > 10, `Unit ${uNum} context question ${cqIdx + 1} has detailed Vietnamese explanation`);
        });

        // Check cloze exercises
        assert(Array.isArray(unit.clozeExercises) && unit.clozeExercises.length === 8, `Unit ${uNum} has 8 cloze fill-in sentences`);
        unit.clozeExercises.forEach((cloze, cIdx) => {
          assert(cloze.sentence.includes('_______'), `Unit ${uNum} cloze item ${cIdx + 1} has blank '_______'`);
          assert(Boolean(cloze.targetWord && cloze.hint), `Unit ${uNum} cloze item ${cIdx + 1} has targetWord and hint`);
        });

        // Check reading quiz
        assert(Array.isArray(unit.readingQuiz) && unit.readingQuiz.length === 5, `Unit ${uNum} has 5 reading comprehension questions`);
        unit.readingQuiz.forEach((rq, rqIdx) => {
          assert(rq.options && rq.options.length === 4 && rq.answer >= 0 && rq.answer <= 3, `Unit ${uNum} reading quiz ${rqIdx + 1} has 4 options and valid answer`);
          assert(rq.explanation && rq.explanation.length > 10, `Unit ${uNum} reading quiz ${rqIdx + 1} has explanation`);
        });

        // Check match pairs
        assert(Array.isArray(unit.matchPairs) && unit.matchPairs.length === 8, `Unit ${uNum} has 8 matching pairs`);
      });

      assert(totalVocab === 48, `Total vocabulary count across all units is exactly 48 (found: ${totalVocab})`);

      // Summary
      logs.push(`
        <div class="summary">
          <strong>Summary:</strong> ${passed} passed, ${failed} failed.
          ${failed === 0 ? '<span style="color:#4ade80;">🎉 ALL TESTS PASSED!</span>' : '<span style="color:#f87171;">⚠️ SOME TESTS FAILED!</span>'}
        </div>
      `);

      output.innerHTML = logs.join('');
    })();
  </script>
</body>
</html>
